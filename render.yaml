services:
  - type: web
    name: gawor-radar-pro
    env: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: OLX_CLIENT_ID
        sync: false
      - key: OLX_CLIENT_SECRET
        sync: false
      - key: OLX_CALLBACK_URL
        value: https://gawor-radar-pro.onrender.com/auth/olx/callback
      - key: OLX_SCOPE
        value: read write v2
