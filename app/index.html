<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f5f"><title>Gawor Agro — Radar PRO</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.min.js"></script><style>body{font-family:Arial;margin:0;background:#f4f6f8;color:#17212b}header{background:#173f5f;color:#fff;padding:16px}.auth{min-height:100vh;display:grid;place-items:center}.card,.panel{background:#fff;border-radius:13px;padding:16px;margin:12px;box-shadow:0 2px 8px #0001}.auth .card{width:min(380px,90%)}input,select,button{padding:10px;margin:4px;border-radius:8px;border:1px solid #ccd5db}button{background:#173f5f;color:#fff;font-weight:bold}.hidden{display:none}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px}.lead{border-top:1px solid #ddd;padding:10px}.red{color:#a00000}@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}}</style></head><body><section id="login" class="auth"><div class="card"><h2>🌾 Gawor Agro Radar PRO</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Hasło"><br><button onclick="loginUser()">Zaloguj</button><button onclick="signup()">Utwórz konto</button><button onclick="resetPw()">Reset hasła</button><p id="msg"></p></div></section><section id="app" class="hidden"><header><b>GAWOR AGRO • RADAR PRO</b><button style="float:right" onclick="logout()">Wyloguj</button></header><div class="kpis"><div class="card">🔴 Pilne<h2 id="u">0</h2></div><div class="card">📞 Telefony<h2 id="c">0</h2></div><div class="card">🌾 Tony<h2 id="t">0</h2></div><div class="card">💰 Marża<h2 id="m">0 zł</h2></div></div><div class="panel"><button onclick="load()">↻ Odśwież</button><a href="/auth/olx/start"><button>🔗 Połącz OLX</button></a></div><div class="panel"><h3>🎯 Najlepsze leady</h3><div id="leads">Ładowanie…</div></div></section><script>const cfg={url:'https://aohywvqmjychkjqejfbg.supabase.co',key:'sb_publishable_exd3X68g0OBdd6Wql5SZjg_I-yvAkdj'};const sb=supabase.createClient(cfg.url,cfg.key);let data=[];async function loginUser(){let{error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)msg.textContent=error.message;else boot()}async function signup(){let{error}=await sb.auth.signUp({email:email.value,password:password.value});msg.textContent=error?error.message:'Konto utworzone — sprawdź email.'}async function resetPw(){let{error}=await sb.auth.resetPasswordForEmail(email.value,{redirectTo:location.origin});msg.textContent=error?error.message:'Wysłano instrukcję.'}async function logout(){await sb.auth.signOut();location.reload()}async function boot(){let{data:x}=await sb.auth.getUser();if(!x.user)return;login.classList.add('hidden');app.classList.remove('hidden');load()}function profit(x){return(Number(x.sell)-Number(x.buy)-Number(x.transport))*Number(x.qty)}async function load(){let{data:x,error}=await sb.from('leads').select('*').order('score',{ascending:false}).limit(500);if(error){leads.textContent=error.message;return}data=x||[];u.textContent=data.filter(x=>x.priority==='PILNY').length;c.textContent=data.filter(x=>['Nowy','Do telefonu','Oferta'].includes(x.status)).length;t.textContent=data.reduce((a,x)=>a+Number(x.qty),0);m.textContent=Math.round(data.reduce((a,x)=>a+profit(x),0)).toLocaleString('pl-PL')+' zł';leads.innerHTML=data.slice(0,30).map(x=>`<div class="lead"><b>${x.commodity} • ${x.qty} t</b> <span class="red">${x.priority} ${x.score}</span><br>📍 ${x.place||'-'} • ${x.distance_km||0} km • ${x.source}<br>💰 ${(Number(x.sell)-Number(x.buy)-Number(x.transport)).toFixed(0)} zł/t • ${profit(x).toFixed(0)} zł ${x.phone?`• <a href="tel:${x.phone}">📞</a>`:''}</div>`).join('')||'Brak leadów'}sb.auth.onAuthStateChange((e,s)=>{if(s)boot()});boot()</script></body></html>
