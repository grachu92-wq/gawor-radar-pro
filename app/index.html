<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f5f"><title>Gawor Agro — Radar PRO</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.min.js"></script><style>body{font-family:Arial;margin:0;background:#f3f5f7;color:#17212b}.hidden{display:none}.auth{min-height:100vh;display:grid;place-items:center}.card,.panel{background:#fff;border-radius:13px;padding:16px;margin:12px;box-shadow:0 2px 8px #0001}.auth .card{width:min(380px,90%)}input,select,textarea{padding:10px;margin:4px 0;border-radius:8px;border:1px solid #ccd5db;width:100%;box-sizing:border-box}button{padding:10px 13px;margin:4px;border-radius:8px;border:0;background:#173f5f;color:#fff;font-weight:bold;cursor:pointer}.btn2{background:#e7eef2;color:#173f5f}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:12px}.num{font-size:24px;font-weight:800}.nav{padding:12px}.lead{border-top:1px solid #ddd;padding:10px}.red{color:#a00000;font-weight:bold}.orange{color:#9a4b00;font-weight:bold}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}.actions{display:flex;gap:6px;flex-wrap:wrap}.msg{padding:8px;margin-top:8px;border-radius:8px;font-size:12px}.err{background:#f4cccc;color:#7a0000}.ok{background:#d9ead3;color:#285c2d}@media(max-width:800px){.kpis{grid-template-columns:1fr 1fr}.form,.filters{grid-template-columns:1fr}}</style></head><body>
<section id="loginView" class="auth"><div class="card"><h2>🌾 Gawor Agro Radar PRO</h2><p>Centralny system pozyskiwania surowca</p><input id="emailInput" type="email" placeholder="Email"><input id="passwordInput" type="password" placeholder="Hasło"><div><button type="button" id="signInBtn">Zaloguj</button><button type="button" id="signUpBtn" class="btn2">Utwórz konto</button><button type="button" id="resetBtn" class="btn2">Reset hasła</button></div><div id="authMsg"></div></div></section>
<section id="appView" class="hidden"><header style="background:#173f5f;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center"><div><b>GAWOR AGRO • RADAR PRO</b><br><small>Pakosławice • centralna baza • web app</small></div><div><span id="userEmail"></span><button type="button" class="btn2" id="logoutBtn">Wyloguj</button></div></header><main><div class="nav"><button type="button" class="active" data-tab="dashboard">🏠 Dashboard</button><button type="button" data-tab="leads">🎯 Leady</button><button type="button" data-tab="add">➕ Dodaj lead</button><button type="button" data-tab="olx">🔗 OLX</button></div>
<section id="dashboard"><div class="kpis"><div class="card">🔴 Pilne<div class="num" id="kUrgent">0</div></div><div class="card">📞 Telefony<div class="num" id="kCalls">0</div></div><div class="card">🌾 Tony<div class="num" id="kTons">0</div></div><div class="card">💰 Marża<div class="num" id="kProfit">0 zł</div></div><div class="card">📡 OLX<div class="num" id="kOlx">0</div></div></div><div class="panel"><h3>🔥 Najlepsze leady</h3><div id="topLeads"></div></div></section>
<section id="leads" class="hidden"><div class="panel"><h3>🎯 Radar leadów</h3><div class="filters"><input id="searchInput" placeholder="Szukaj"><select id="fCom"><option value="">Wszystkie towary</option><option>Pszenica</option><option>Jęczmień</option><option>Rzepak</option><option>Pszenżyto</option><option>Kukurydza</option><option>Kukurydza mokra</option></select><select id="fPri"><option value="">Priorytet</option><option>PILNY</option><option>DOBRY</option><option>SLABY</option></select><select id="fStatus"><option value="">Status</option><option>Nowy</option><option>Do telefonu</option><option>Kontakt wykonany</option><option>Oferta</option><option>Kontrakt</option><option>Zamknięty</option></select></div><div id="leadList"></div></div></section>
<section id="add" class="hidden"><div class="panel"><h3>➕ Dodaj lead</h3><div class="form"><div><label>Towar</label><select id="commodity"><option>Pszenica</option><option>Jęczmień</option><option>Rzepak</option><option>Pszenżyto</option><option>Kukurydza</option><option>Kukurydza mokra</option></select></div><div><label>Źródło</label><select id="source"><option>Telefon</option><option>OLX</option><option>Facebook</option><option>Google</option><option>Baza własna</option></select></div><div><label>Miejscowość</label><input id="place"></div><div><label>Odległość km</label><input id="distance" type="number" value="20"></div><div><label>Ilość t</label><input id="qty" type="number" value="50"></div><div><label>Cena zakupu zł/t</label><input id="buy" type="number" value="790"></div><div><label>Transport zł/t</label><input id="transport" type="number" value="20"></div><div><label>Cena sprzedaży zł/t</label><input id="sell" type="number" value="825"></div><div><label>Telefon</label><input id="phone" type="tel"></div><div><label>Link</label><input id="url" type="url"></div><div><label>Wilgotność %</label><input id="moisture" type="number" step="0.1"></div></div><label>Notatka</label><textarea id="note"></textarea><div class="actions"><button type="button" id="addLeadBtn">Dodaj do radaru</button></div></div></section>
<section id="olx" class="hidden"><div class="panel"><h3>🔗 OLX</h3><div id="olxStatus">Sprawdzanie…</div><div class="actions"><a id="olxConnect" href="/auth/olx/start"><button type="button">Połącz z OLX</button></a><button type="button" class="btn2" id="syncOlxBtn">Synchronizuj</button></div></div><div class="panel"><h3>📋 Własne ogłoszenia OLX</h3><div id="olxList"></div></div></section></main></section>
<script>
const SUPABASE_URL='https://aohywvqmjychkjqejfbg.supabase.co';const SUPABASE_KEY='sb_publishable_exd3X68g0OBdd6Wql5SZjg_I-yvAkdj';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let leads=[];
const $=id=>document.getElementById(id);function authMsg(t,ok=false){$('authMsg').className='msg '+(ok?'ok':'err');$('authMsg').textContent=t}
async function signIn(){try{const email=$('emailInput').value.trim(),password=$('passwordInput').value;if(!email||!password)return authMsg('Wpisz email i hasło.');const {error}=await sb.auth.signInWithPassword({email,password});if(error)return authMsg(error.message);await boot()}catch(e){authMsg('Błąd logowania: '+e.message)}}
async function signUp(){try{const email=$('emailInput').value.trim(),password=$('passwordInput').value;if(!email||!password)return authMsg('Wpisz email i hasło.');const {error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:window.location.origin}});if(error)return authMsg(error.message);authMsg('Konto utworzone. Sprawdź email, jeśli wymagana jest weryfikacja.',true)}catch(e){authMsg('Błąd rejestracji: '+e.message)}}
async function resetPw(){try{const email=$('emailInput').value.trim();if(!email)return authMsg('Wpisz email.');const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin});if(error)return authMsg(error.message);authMsg('Instrukcja resetu została wysłana.',true)}catch(e){authMsg('Błąd resetu: '+e.message)}}
async function logout(){await sb.auth.signOut();location.reload()}
function showApp(user){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('userEmail').textContent=user.email||''}
function showLogin(){$('appView').classList.add('hidden');$('loginView').classList.remove('hidden')}
async function boot(){const {data,error}=await sb.auth.getUser();if(error||!data.user)return showLogin();showApp(data.user);await loadAll()}
$('signInBtn').addEventListener('click',signIn);$('signUpBtn').addEventListener('click',signUp);$('resetBtn').addEventListener('click',resetPw);$('logoutBtn').addEventListener('click',logout);['emailInput','passwordInput'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')signIn()}));
async function loadLeads(){const {data,error}=await sb.from('leads').select('*').order('score',{ascending:false}).limit(500);if(error){console.error(error);return}leads=data||[]}
function profit(x){return (Number(x.sell)-Number(x.buy)-Number(x.transport))*Number(x.qty)}
function card(x){const cls=x.priority==='PILNY'?'red':x.priority==='DOBRY'?'orange':'';return `<div class="lead"><b>${x.commodity} • ${x.qty} t</b> <span class="${cls}">${x.priority} • ${x.score}</span><br>📍 ${x.place||'-'} • ${x.distance_km||0} km • ${x.source}<br>💰 ${(Number(x.sell)-Number(x.buy)-Number(x.transport)).toFixed(0)} zł/t • ${profit(x).toFixed(0)} zł<br><div class="actions">${x.phone?`<a href="tel:${x.phone}"><button type="button" class="btn2">📞 Dzwoń</button></a>`:''}${x.url?`<a href="${x.url}" target="_blank"><button type="button" class="btn2">🔗 Ogłoszenie</button></a>`:''}<select onchange="setStatus(${x.id},this.value)"><option ${x.status==='Nowy'?'selected':''}>Nowy</option><option ${x.status==='Do telefonu'?'selected':''}>Do telefonu</option><option ${x.status==='Kontakt wykonany'?'selected':''}>Kontakt wykonany</option><option ${x.status==='Oferta'?'selected':''}>Oferta</option><option ${x.status==='Kontrakt'?'selected':''}>Kontrakt</option><option ${x.status==='Zamknięty'?'selected':''}>Zamknięty</option></select></div></div>`}
function renderLeads(){const q=$('searchInput').value.toLowerCase(),c=$('fCom').value,p=$('fPri').value,s=$('fStatus').value;const a=leads.filter(x=>(!q||(`${x.place} ${x.phone} ${x.note}`).toLowerCase().includes(q))&&(!c||x.commodity===c)&&(!p||x.priority===p)&&(!s||x.status===s));$('leadList').innerHTML=a.map(card).join('')||'<div>Brak wyników.</div>'}
async function setStatus(id,status){const {error}=await sb.from('leads').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);await loadAll()}
async function addLead(){const x={commodity:$('commodity').value,source:$('source').value,place:$('place').value,distance_km:+$('distance').value,qty:+$('qty').value,buy:+$('buy').value,transport:+$('transport').value,sell:+$('sell').value,phone:$('phone').value,url:$('url').value,moisture:$('moisture').value?+$('moisture').value:null,note:$('note').value};let s=0;s+=x.qty>=50?15:0;s+=x.distance_km<=30?10:x.distance_km<=50?5:0;s+=x.phone?20:0;s+=x.place?20:0;s+=15;s+=x.distance_km>70?-20:0;s+=x.qty<10?-10:0;s+=(x.sell-x.buy-x.transport)>0?15:0;x.score=s;x.priority=s>=80?'PILNY':s>=55?'DOBRY':'SLABY';const {error}=await sb.from('leads').insert(x);if(error)return alert(error.message);alert('Lead dodany');await loadAll();showTab('leads')}
async function loadOlx(){try{const st=await fetch('/olx/status').then(r=>r.json());$('olxStatus').textContent=st.connected?`🟢 Połączono • ${st.adverts} ogłoszeń`:'🔴 OLX niepołączony';const a=await fetch('/olx/adverts').then(r=>r.json());$('olxList').innerHTML=a.map(x=>`<div class="lead"><b>${x.title||'(bez tytułu)'}</b><br><small>${x.status||''} • ${x.city_name||''} • ${x.price||''} ${x.currency||''}</small></div>`).join('')||'Brak ogłoszeń.'}catch(e){$('olxStatus').textContent='Nie można połączyć z modułem OLX.'}}
async function syncOlx(){const x=await fetch('/olx/sync',{method:'POST'}).then(r=>r.json());alert(x.ok?`Zsynchronizowano ${x.count||0}`:(x.detail||x.reason||'Błąd'));loadOlx()}
async function loadAll(){await loadLeads();$('kUrgent').textContent=leads.filter(x=>x.priority==='PILNY').length;$('kCalls').textContent=leads.filter(x=>['Nowy','Do telefonu','Oferta'].includes(x.status)).length;$('kTons').textContent=leads.reduce((a,x)=>a+Number(x.qty),0);$('kProfit').textContent=Math.round(leads.reduce((a,x)=>a+profit(x),0)).toLocaleString('pl-PL')+' zł';$('topLeads').innerHTML=leads.slice(0,5).map(card).join('')||'Brak leadów.';try{$('kOlx').textContent=(await fetch('/olx/status').then(r=>r.json())).adverts||0}catch{}renderLeads()}
function showTab(id){document.querySelectorAll('main section').forEach(s=>s.classList.toggle('hidden',s.id!==id));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));if(id==='olx')loadOlx();if(id==='leads')renderLeads()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));['searchInput','fCom','fPri','fStatus'].forEach(id=>$(id).addEventListener('input',renderLeads));$('addLeadBtn').addEventListener('click',addLead);$('syncOlxBtn').addEventListener('click',syncOlx);sb.auth.onAuthStateChange((_e,s)=>s?showApp(s.user):showLogin());boot();
</script></body></html>
