<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f5f"><title>Gawor Agro — Radar PRO</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.min.js"></script><style>
:root{--nav:#173f5f;--bg:#f3f5f7;--card:#fff;--muted:#687782;--line:#dde4e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17212b;font-family:Arial,sans-serif}header{background:var(--nav);color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800}.small{font-size:11px;opacity:.8}main{max-width:1100px;margin:auto;padding:14px}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authcard{background:#fff;padding:24px;border-radius:15px;width:min(420px,95%);box-shadow:0 6px 25px #0001}.authcard h1{margin-top:0}label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin:10px 0 4px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:15px}button,a.btn{display:inline-block;padding:11px 14px;border:0;border-radius:8px;background:var(--nav);color:#fff;text-decoration:none;font-weight:700;cursor:pointer}.secondary{background:#e8eef2!important;color:var(--nav)!important}.msg{margin-top:10px;padding:9px;border-radius:8px;font-size:12px}.err{background:#f4cccc;color:#7a0000}.ok{background:#d9ead3;color:#285c2d}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.nav button{background:#e8eef2;color:var(--nav)}.nav button.active{background:var(--nav);color:#fff}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.panel{background:#fff;border-radius:13px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}.label{font-size:11px;color:var(--muted)}.num{font-size:26px;font-weight:800;margin-top:5px}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.lead{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0}.meta{color:var(--muted);font-size:12px}.profit{font-weight:800;margin-top:6px}.badge{display:inline-block;padding:4px 7px;border-radius:99px;font-size:10px;font-weight:800}.p1{background:#f4cccc;color:#8b0000}.p2{background:#fce5cd;color:#9a4b00}.p3{background:#fff2cc;color:#7a6200}@media(max-width:800px){.kpis{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 1fr}}@media(max-width:520px){.row{grid-template-columns:1fr}}
</style></head><body>
<section id="loginView" class="auth"><div class="authcard"><h1>🌾 Gawor Agro Radar PRO</h1><p>Logowanie do centralnego systemu.</p><label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="username"><label for="loginPassword">Hasło</label><input id="loginPassword" type="password" autocomplete="current-password"><div style="display:grid;gap:8px;margin-top:14px"><button id="loginBtn" type="button">Zaloguj</button><button id="signupBtn" type="button" class="secondary">Utwórz konto</button><button id="resetBtn" type="button" class="secondary">Reset hasła</button></div><div id="authMsg"></div></div></section>
<section id="appView" class="hidden"><header><div><div class="brand">GAWOR AGRO • RADAR PRO</div><div class="small">Pakosławice • centralna baza</div></div><div><span id="userEmail" class="small"></span> <button id="logoutBtn" class="secondary" type="button">Wyloguj</button></div></header><main>
<div class="nav"><button id="tabDashboard" class="active" type="button">🏠 Dashboard</button><button id="tabLeads" type="button">🎯 Leady</button><button id="tabAdd" type="button">➕ Dodaj lead</button><button id="tabOlx" type="button">🔗 OLX</button></div>
<section id="dashboard"><div class="kpis"><div class="card"><div class="label">🔴 PILNE</div><div class="num" id="kUrgent">0</div></div><div class="card"><div class="label">📞 TELEFONY</div><div class="num" id="kCalls">0</div></div><div class="card"><div class="label">🌾 TONY</div><div class="num" id="kTons">0</div></div><div class="card"><div class="label">💰 MARŻA</div><div class="num" id="kProfit">0 zł</div></div></div><div class="panel"><h3>🔥 Najlepsze leady</h3><div id="topLeads"></div></div></section>
<section id="leadsSection" class="hidden"><div class="panel"><h3>🎯 Leady</h3><div id="leadList"></div></div></section>
<section id="addSection" class="hidden"><div class="panel"><h3>➕ Dodaj lead</h3><div class="row"><div><label>Towar</label><select id="commodity"><option>Pszenica</option><option>Jęczmień</option><option>Rzepak</option><option>Pszenżyto</option><option>Kukurydza</option><option>Kukurydza mokra</option></select></div><div><label>Źródło</label><select id="source"><option>Telefon</option><option>OLX</option><option>Facebook</option><option>Google</option><option>Baza własna</option></select></div><div><label>Miejscowość</label><input id="place"></div><div><label>Odległość km</label><input id="distance" type="number" value="20"></div><div><label>Ilość t</label><input id="qty" type="number" value="50"></div><div><label>Cena zakupu zł/t</label><input id="buy" type="number" value="790"></div><div><label>Transport zł/t</label><input id="transport" type="number" value="20"></div><div><label>Cena sprzedaży zł/t</label><input id="sell" type="number" value="825"></div><div><label>Telefon</label><input id="phone" type="tel"></div></div><button id="addLeadBtn" type="button" style="margin-top:10px">Dodaj do radaru</button></div></section>
<section id="olxSection" class="hidden"><div class="panel"><h3>🔗 OLX</h3><div id="olxStatus" class="meta">Sprawdzanie…</div><div style="margin-top:10px"><a class="btn" href="/auth/olx/start">Połącz z OLX</a> <button id="syncOlxBtn" type="button">Synchronizuj</button></div></div><div class="panel"><div id="olxList"></div></div></section>
</main></section>
<script>
(function(){
const supabaseClient=window.supabase.createClient('https://aohywvqmjychkjqejfbg.supabase.co','sb_publishable_exd3X68g0OBdd6Wql5SZjg_I-yvAkdj');
const $=id=>document.getElementById(id);
const els={loginView:$('loginView'),appView:$('appView'),loginEmail:$('loginEmail'),loginPassword:$('loginPassword'),authMsg:$('authMsg'),userEmail:$('userEmail'),dashboard:$('dashboard'),leadsSection:$('leadsSection'),addSection:$('addSection'),olxSection:$('olxSection'),leadList:$('leadList'),topLeads:$('topLeads'),kUrgent:$('kUrgent'),kCalls:$('kCalls'),kTons:$('kTons'),kProfit:$('kProfit'),olxStatus:$('olxStatus'),olxList:$('olxList')};
let leads=[];
function showMsg(t,ok){els.authMsg.className='msg '+(ok?'ok':'err');els.authMsg.textContent=t}
async function login(){const email=els.loginEmail.value.trim(),password=els.loginPassword.value;if(!email||!password){showMsg('Wpisz email i hasło.');return}showMsg('Logowanie…',true);const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){showMsg(error.message,false);return}await showApp(data.user)}
async function signup(){const email=els.loginEmail.value.trim(),password=els.loginPassword.value;if(!email||!password){showMsg('Wpisz email i hasło.');return}const {error}=await supabaseClient.auth.signUp({email,password,options:{emailRedirectTo:location.origin}});if(error){showMsg(error.message,false);return}showMsg('Konto utworzone. Sprawdź email, jeśli potwierdzenie jest wymagane.',true)}
async function resetPassword(){const email=els.loginEmail.value.trim();if(!email){showMsg('Wpisz email.');return}const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:location.origin});showMsg(error?error.message:'Wysłaliśmy instrukcję resetu hasła.',!error)}
async function showApp(user){els.loginView.classList.add('hidden');els.appView.classList.remove('hidden');els.userEmail.textContent=user?.email||'';await loadLeads();showTab('dashboard')}
async function logout(){await supabaseClient.auth.signOut();location.reload()}
function showTab(name){els.dashboard.classList.toggle('hidden',name!=='dashboard');els.leadsSection.classList.toggle('hidden',name!=='leads');els.addSection.classList.toggle('hidden',name!=='add');els.olxSection.classList.toggle('hidden',name!=='olx');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));const map={dashboard:'tabDashboard',leads:'tabLeads',add:'tabAdd',olx:'tabOlx'};$(map[name]).classList.add('active');if(name==='olx')loadOlx()}
function calcPriority(x){let s=0;s+=Number(x.qty)>=50?15:0;s+=Number(x.distance_km)<=30?10:(Number(x.distance_km)<=50?5:0);s+=x.phone?20:0;s+=x.place?20:0;s+=15;s+=Number(x.distance_km)>70?-20:0;s+=Number(x.qty)<10?-10:0;s+=(Number(x.sell)-Number(x.buy)-Number(x.transport))>0?15:0;return [s,s>=80?'PILNY':(s>=55?'DOBRY':'SLABY')]}
function profit(x){return (Number(x.sell)-Number(x.buy)-Number(x.transport))*Number(x.qty)}
function card(x){const cls=x.priority==='PILNY'?'p1':x.priority==='DOBRY'?'p2':'p3';return `<div class="lead"><b>${x.commodity} • ${x.qty} t</b> <span class="badge ${cls}">${x.priority} • ${x.score}</span><div class="meta">📍 ${x.place||'-'} • ${x.distance_km||0} km • ${x.source}</div><div class="profit">${(Number(x.sell)-Number(x.buy)-Number(x.transport)).toFixed(0)} zł/t • ${profit(x).toFixed(0)} zł</div>${x.phone?`<div><a href="tel:${x.phone}" class="btn secondary">📞 Dzwoń</a></div>`:''}</div>`}
async function loadLeads(){const r=await supabaseClient.from('leads').select('*').order('score',{ascending:false}).limit(500);if(r.error){els.leadList.textContent=r.error.message;return}leads=r.data||[];els.kUrgent.textContent=leads.filter(x=>x.priority==='PILNY').length;els.kCalls.textContent=leads.filter(x=>['Nowy','Do telefonu','Oferta'].includes(x.status)).length;els.kTons.textContent=leads.reduce((a,x)=>a+Number(x.qty),0);els.kProfit.textContent=Math.round(leads.reduce((a,x)=>a+profit(x),0)).toLocaleString('pl-PL')+' zł';els.topLeads.innerHTML=leads.slice(0,5).map(card).join('')||'<div class="meta">Brak leadów.</div>';els.leadList.innerHTML=leads.map(card).join('')||'<div class="meta">Brak leadów.</div>'}
async function addLead(){const x={commodity:$('commodity').value,source:$('source').value,place:$('place').value,distance_km:Number($('distance').value),qty:Number($('qty').value),buy:Number($('buy').value),transport:Number($('transport').value),sell:Number($('sell').value),phone:$('phone').value,status:'Nowy'};const [score,priority]=calcPriority(x);x.score=score;x.priority=priority;const r=await supabaseClient.from('leads').insert(x);if(r.error){alert(r.error.message);return}alert('Lead dodany.');await loadLeads();showTab('leads')}
async function loadOlx(){try{const s=await fetch('/olx/status').then(r=>r.json());els.olxStatus.textContent=s.connected?`🟢 Połączono • ${s.adverts} ogłoszeń`:'🔴 OLX niepołączony';const a=await fetch('/olx/adverts').then(r=>r.json());els.olxList.innerHTML=(a||[]).map(x=>`<div class="lead"><b>${x.title||'(bez tytułu)'}</b><div class="meta">${x.status||''} • ${x.city_name||''} • ${x.price||''} ${x.currency||''}</div></div>`).join('')||'<div class="meta">Brak ogłoszeń.</div>'}catch(e){els.olxStatus.textContent='OLX niedostępny — moduł serwerowy jeszcze nie skonfigurowany.'}}
async function syncOlx(){const r=await fetch('/olx/sync',{method:'POST'});const x=await r.json();alert(x.ok?`Zsynchronizowano ${x.count||0} ogłoszeń.`:(x.detail||x.reason||'Błąd'));loadOlx()}
$('loginBtn').addEventListener('click',login);$('signupBtn').addEventListener('click',signup);$('resetBtn').addEventListener('click',resetPassword);$('logoutBtn').addEventListener('click',logout);$('tabDashboard').addEventListener('click',()=>showTab('dashboard'));$('tabLeads').addEventListener('click',()=>showTab('leads'));$('tabAdd').addEventListener('click',()=>showTab('add'));$('tabOlx').addEventListener('click',()=>showTab('olx'));$('addLeadBtn').addEventListener('click',addLead);$('syncOlxBtn').addEventListener('click',syncOlx);els.loginPassword.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
(async()=>{const {data}=await supabaseClient.auth.getUser();if(data.user)await showApp(data.user);else els.loginView.classList.remove('hidden')})();
supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session)showApp(session.user)});
})();
</script></body></html>
